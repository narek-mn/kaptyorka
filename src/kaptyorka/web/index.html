<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>kaptyorka</title>
<style>
/* the team design tokens (dark): warm stone and charcoal, square corners, no shadows,
   coral as the one accent, Archivo */
@font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url(/fonts/archivo-latin.woff2) format("woff2"); }
:root {
  --bg: #1b1a16;
  --surface: #211f1a;
  --surface2: #2a2822;
  --hover: #302d26;
  --ink: #e7e4dc;
  --muted: #aaa498;
  --faint: #79766c;
  --line: rgba(231, 228, 220, 0.18);
  --line-strong: rgba(231, 228, 220, 0.5);
  --line-ctl: rgba(231, 228, 220, 0.3);  /* the edge of a control: buttons, inputs, selects */
  --ease: 150ms cubic-bezier(.2, .7, .3, 1);
  --danger: #d59587;
  --risk: #c2942f;
  --ok: #699f08;
  --accent: #da6947;
  --accent-soft: rgba(218, 105, 71, 0.2);
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.4 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* lock */
#lock { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; color: var(--faint); }
#unlock { display: flex; gap: 8px; width: min(360px, calc(100vw - 32px)); }
#unlock input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; font-family: var(--mono); font-size: 13px; }
#lock .hint { text-align: center; margin: -10px 0 0; width: min(360px, calc(100vw - 32px)); font-size: 13px; color: var(--muted); }
#lock[data-mode="wait"] #unlock, #lock[data-mode="wait"] .hint, #lock[data-mode="wait"] #gitlab-signin { visibility: hidden; }
#lock[data-mode="gitlab"] #unlock, #lock[data-mode="gitlab"] .hint, #lock:not([data-mode="gitlab"]) #gitlab-signin { display: none; }
#gitlab-signin { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 22px; font-size: 14px; text-decoration: none; width: min(360px, calc(100vw - 32px)); }
#lock-err { text-align: center; margin-top: -14px; width: min(360px, calc(100vw - 32px)); padding: 0; font-size: 13px; }

/* top bar: the mark, Home and Admin, the person */
#app { display: flex; flex-direction: column; height: 100%; }
header {
  display: flex; align-items: stretch; gap: 28px;
  height: 48px; padding: 0 24px; flex: none;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; }
nav { display: flex; align-items: stretch; gap: 20px; }
.tab { position: relative; display: flex; align-items: center; gap: 6px; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.count { min-width: 18px; padding: 0 5px; font-size: 11px; line-height: 16px; text-align: center; color: var(--bg); background: var(--accent); }
.viewer { position: relative; margin-left: auto; display: flex; align-items: center; }
#viewer-name { color: var(--muted); height: 100%; }
#viewer-name:hover, .viewer.open #viewer-name { color: var(--ink); }
/* Sign out under the name, on hover or click */
.signout { display: none; position: absolute; top: 100%; right: -8px; z-index: 30; align-items: center; gap: 8px;
  padding: 9px 12px; white-space: nowrap; color: var(--ink); background: var(--surface2); border: 1px solid var(--line); }
.signout:hover { background: var(--hover); }
.viewer:hover .signout, .viewer.open .signout { display: flex; }
.live { display: flex; align-items: center; flex: none; margin-left: -12px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.live.down i { background: var(--danger); }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel { background: var(--surface); border: 1px solid var(--line); }

/* Home: a two-pane chat. The list on the left (manager first), the open chat on the right,
   its compose box pinned to the bottom */
#home { display: grid; grid-template-columns: 296px minmax(0, 1fr); min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.list { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 6px 0; }
.list .row { display: grid; grid-template-columns: 15px minmax(0, 1fr) auto auto; align-items: center; column-gap: 11px;
  width: 100%; min-height: 54px; padding: 8px 16px 8px 14px; text-align: left;
  border-left: 3px solid transparent; box-shadow: inset 0 -1px rgba(231, 228, 220, .06);
  transition: background-color var(--ease), border-color var(--ease); }
.list .row:hover { background: var(--surface2); }
.list .row:active { background: var(--hover); }
.list .row.on { background: var(--hover); border-left-color: var(--accent); }
.list .row.on .name { color: var(--ink); font-weight: 650; }
.list .row.off { cursor: default; color: var(--faint); }
.list .row.off:hover { background: none; }
.list .row > svg { color: var(--muted); }
.list .row.on > svg { color: var(--ink); }
.list .row.activity { border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.list .lead { width: 15px; display: flex; justify-content: center; flex: none; }
.list .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.list .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--ink); }
.list .row.unread .name { font-weight: 650; }
.list .subline { display: flex; gap: 8px; min-width: 0; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.list .subline span { overflow: hidden; text-overflow: ellipsis; }
.list .who { color: var(--muted); flex: none; }
.list .n { flex: none; font-size: 12px; color: var(--muted); }
.list .count { flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); }
.bg-lead { display: flex; color: var(--faint); }
.bg-lead.on { color: var(--ok); }
/* Background: Claude Code background jobs, folded into one group under the chats */
.list .bg-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin-top: 10px; padding: 10px 16px 8px 17px;
  border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); text-align: left;
  transition: color var(--ease), background-color var(--ease); }
.list .bg-head:hover { color: var(--ink); background: var(--surface2); }
.list .bg-head:active { background: var(--hover); }
.list .bg-head:focus-visible { outline-offset: -2px; }
.list .bg-head > svg { color: var(--faint); transition: transform var(--ease); }
.list .bg-head[aria-expanded="true"] > svg { transform: rotate(90deg); }
.list .bg-head small { font-weight: 400; color: var(--faint); }
.list .bg-head .count { margin-left: auto; }
.list .bg-rows.enter .row { animation: bg-in 150ms cubic-bezier(.2, .7, .3, 1); }
@keyframes bg-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.quiet-line { padding: 4px 16px 12px; font-size: 12px; color: var(--faint); }
.read-only { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid var(--line);
  background: var(--surface); font-size: 12px; color: var(--muted); }
.side-foot { flex: none; margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line); }
.side-foot .btn { width: 100%; }
.side-foot .btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.chat-head { flex: none; display: flex; align-items: center; gap: 11px; height: 58px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.chat-head #chat-lead { display: flex; color: var(--muted); }
.chat-title { min-width: 0; display: flex; flex-direction: column; }
.chat-title b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-title small { display: flex; gap: 10px; font-size: 12px; color: var(--faint); overflow: hidden; white-space: nowrap; }
.chat-title small span:first-child { color: var(--muted); }
#notices-toggle { margin-left: auto; color: var(--muted); }
#notices-toggle small { color: var(--faint); font-size: 11px; }
/* a slim bar over the chat: only what stops someone working, and its command */
#warns { flex: none; list-style: none; margin: 0; padding: 0; }
#warns:empty { display: none; }
#warns li { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 5px 16px 5px 24px; font-size: 13px; color: var(--risk);
  background: rgba(194, 148, 47, .09); border-bottom: 1px solid rgba(194, 148, 47, .35); }
#warns li > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#warns code { flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 7px; font: 12px var(--mono);
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); user-select: all; }
#warns .btn { padding: 0 7px; }
#log { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 18px; }
.day { display: flex; align-items: center; gap: 12px; margin: 18px 0 6px; font-size: 12px; color: var(--faint); }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group { padding: 8px 0 6px; margin-top: 8px; }
/* my own messages: a rule on the left */
.group.mine { margin-left: -14px; padding-left: 12px; border-left: 2px solid var(--accent); }
.group .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-bottom: 2px; }
.group .head b { font-weight: 650; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group .head b.mine { color: var(--accent); }
.group .head .to { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
.group .head .to span { overflow: hidden; text-overflow: ellipsis; }
.group .head .to svg { color: var(--faint); }
.group .head time, .msg.sys time { flex: none; font-size: 12px; color: var(--faint); }
.msg { padding: 1px 0; }
.msg .text { max-width: 76ch; line-height: 1.55; }
.msg .text.moving { overflow: hidden; transition: max-height 180ms cubic-bezier(.2, .7, .3, 1); }
.new { animation: rise 180ms cubic-bezier(.2, .7, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg .text.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 12; overflow: hidden; }
.msg .more { margin-top: 4px; font-size: 12px; font-weight: 500; color: var(--accent); }
.msg .more:hover { text-decoration: underline; }
.msg.sys { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 12px; }
.msg.sys > svg { align-self: center; color: var(--faint); }
.msg.sys .text { color: var(--muted); min-width: 0; }
/* my message on its way, and where it is: quiet, under the last one only */
.msg.out.sending .text, .msg.out.sending .att-out { opacity: .55; }
.msg.out.failed .text { color: var(--muted); }
.att-out { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.tick { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11.5px; color: var(--faint); }
.tick.delivered { color: var(--muted); }
.tick.failed { color: var(--danger); }
.tick button { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; }
.tick button:hover { text-decoration: underline; }
.tick .spin { width: 9px; height: 9px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
/* the session is working on my message: three dots, its name, what it says it does */
.working { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 12px 0 2px; font-size: 12.5px; color: var(--muted); animation: rise 180ms cubic-bezier(.2, .7, .3, 1); }
.working b { font-weight: 600; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.working .what { flex: none; }
.working .more-act { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); }
.working .dots { flex: none; display: inline-flex; gap: 3px; }
.working .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: dot 1.2s ease-in-out infinite; }
.working .dots i:nth-child(2) { animation-delay: .15s; }
.working .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
.chat .blank { color: var(--faint); }
#log > .blank:only-child { height: 100%; min-height: 0; font-size: 13px; text-wrap: balance; }
.access-pane { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
.compose { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 12px 24px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.compose textarea { flex: 1; min-width: 0; height: 40px; max-height: 200px; padding: 9px 12px; resize: none; line-height: 1.4;
  background: var(--bg); }
.compose .btn { height: 40px; }
.compose .btn.primary { padding: 0 16px; }
.compose .attach { color: var(--muted); }
.compose .file-chip { height: 40px; max-width: 220px; min-width: 0; }
.chat > .err { padding: 0 24px 10px; margin-top: -6px; }
.file-chip .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.file-chip small { flex: none; }

/* shared parts */
.tag {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
  border: 1px solid var(--line); color: var(--ink); font-size: 12px; background: var(--surface); white-space: nowrap;
}
.tag small { font-size: 12px; color: var(--faint); }
.tag .x { color: var(--faint); margin-right: -3px; padding: 0 2px; }
.tag .x:hover { color: var(--danger); }
.sentence code { font: 12px var(--mono); color: var(--ink); }
.hint { font-size: 12px; color: var(--faint); }
.att { display: block; max-width: min(360px, 100%); max-height: 260px; margin-top: 7px; border: 1px solid var(--line); background: var(--bg); }
.file { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--accent); font-size: 12px; text-decoration: none; }
.file:hover { text-decoration: underline; }
.file.failed { color: var(--danger); }
.file small { color: var(--faint); font-size: 12px; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
select, input, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line-ctl); transition: border-color var(--ease);
}
select { background: var(--surface2); cursor: pointer; }
select:hover, input:hover, textarea:hover { border-color: var(--line-strong); }
::placeholder { color: var(--faint); opacity: 1; }
/* the focus ring: the border and an inner line in the accent, inside the box */
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
/* three kinds of button: primary (filled), secondary (outlined), icon (square) */
.btn {
  height: 34px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line-ctl); color: var(--ink); background: transparent; font-weight: 500; font-size: 13px; flex: none;
  transition: background-color var(--ease), border-color var(--ease), color var(--ease);
}
.btn:hover { background: var(--surface2); border-color: var(--line-strong); }
.btn:active { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled, .btn[aria-busy="true"] { opacity: .5; cursor: default; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: #e27a5a; border-color: #e27a5a; }
.btn.primary:active { background: #c45a3a; border-color: #c45a3a; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
/* a row's destructive action: quiet red until hovered */
.btn.quiet-danger { color: var(--danger); border-color: rgba(213, 149, 135, .32); }
.btn.quiet-danger:hover { border-color: var(--danger); background: rgba(213, 149, 135, .1); }
.btn.quiet-danger:active { background: rgba(213, 149, 135, .18); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon.small { width: 28px; }
.compose .btn.icon { width: 40px; }
.btn.copied { color: var(--ok); border-color: var(--ok); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ok { color: var(--ok); font-size: 12px; }
.err { flex: none; color: var(--danger); font-size: 12px; padding: 6px 2px 0; }
.blank { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); min-height: 200px; padding: 24px; text-align: center; }
.list + .blank, .chat .blank { min-height: 120px; color: var(--faint); }
.back { display: none; }

/* Team: the admin's one screen. Waiting for you, then the people, in one centred column */
#team { overflow-y: auto; }
.team { width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-direction: column; }
.t-head { margin: 0; font-size: 15px; font-weight: 650; color: var(--ink); }
#waiting { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
#waiting .t-list { border-left: 2px solid var(--accent); }
.t-bar { display: flex; align-items: center; gap: 12px; min-height: 34px; margin-bottom: 10px; }
.t-bar .btn { margin-left: auto; }
.w-row { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 9px 10px 9px 16px;
  border-bottom: 1px solid var(--line); transition: background-color var(--ease), opacity var(--ease); }
.w-row:last-child { border-bottom: 0; }
.w-row:hover { background: var(--surface2); }
.w-row.going { opacity: .55; }
.w-row.new { animation: rise 180ms cubic-bezier(.2, .7, .3, 1); }
.w-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 0 4px; white-space: nowrap; color: var(--muted); }
.w-text b { font-weight: 600; color: var(--ink); }
.w-why { min-width: 0; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; color: var(--faint); font-size: 13px; }
.w-acts { flex: none; display: flex; gap: 6px; }
.w-acts .btn { min-width: 52px; }
.person { border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.p-line { display: flex; align-items: center; gap: 10px; padding-right: 10px; transition: background-color var(--ease); }
.p-line:hover { background: var(--surface2); }
.person.open .p-line { background: var(--surface2); }
.p-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 8px minmax(72px, max-content) minmax(0, 1fr) 13px;
  align-items: center; column-gap: 14px; min-height: 52px; padding: 8px 6px 8px 16px; text-align: left; }
.p-main.still { grid-template-columns: 8px minmax(72px, max-content) minmax(0, 1fr); cursor: default; }
.p-main:focus-visible { outline-offset: -2px; }
.p-main:active { background: var(--hover); }
.p-main.still:active { background: none; }
.p-name { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
.p-sum.quiet { color: var(--faint); }
.p-act { display: flex; gap: 6px; align-items: center; }
.btn.p-gl { color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; line-height: 26px; }
.btn.p-gl.unset { color: var(--faint); border-style: dashed; }
.btn.p-gl:hover { color: var(--text); }
.p-main > svg { color: var(--faint); transition: transform var(--ease), color var(--ease); }
.p-main:hover > svg { color: var(--muted); }
.p-main[aria-expanded="true"] > svg { transform: rotate(90deg); color: var(--ink); }
.p-act { flex: none; display: flex; justify-content: flex-end; min-width: 132px; }  /* every chevron in one column */
.p-line:has(.confirm) .p-act { min-width: 0; }
.p-act .confirm { max-width: 420px; }
.p-projects { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 16px 38px; background: var(--surface2);
  animation: bg-in 150ms cubic-bezier(.2, .7, .3, 1); }
.p-projects .quiet { font-size: 13px; color: var(--faint); }
.p-rm { margin-left: auto; display: flex; align-items: center; }
.proj { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; font-size: 13px; color: var(--muted);
  border: 1px solid var(--line-ctl); background: var(--surface); cursor: pointer; user-select: none;
  transition: border-color var(--ease), color var(--ease), background-color var(--ease); }
.proj:hover { border-color: var(--line-strong); color: var(--ink); }
.proj.on { color: var(--ink); border-color: rgba(218, 105, 71, .6); background: var(--accent-soft); }
.proj:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.proj input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
.proj input:focus { box-shadow: none; }
.proj input:disabled { cursor: default; }
.proj small { font-size: 11px; }
.p-link { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px 38px; color: var(--muted); }
.p-link input, .add-link input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; font: 12px var(--mono); }
.add-box { margin-bottom: 14px; animation: bg-in 150ms cubic-bezier(.2, .7, .3, 1); }
.add-form, .add-link { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
.add-form input { flex: 0 1 260px; min-width: 0; height: 28px; padding: 0 8px; font-size: 13px; }
.add-who { flex: none; color: var(--muted); font-size: 13px; }
.add-who b { color: var(--ink); font-weight: 600; }
.add-box .err, #team-err, #waiting-err { padding: 0 14px 10px; }
#team-err { padding: 8px 2px 0; }
.t-ok { padding: 0 2px 10px; font-size: 13px; }
/* Team > Projects: every GitLab project and every project on the hub, one row each */
.t-bar.pj-bar { margin-top: 36px; }
.pj-note { padding: 0 2px 10px; font-size: 13px; color: var(--faint); }
.pj-note.bad { color: var(--danger); }
.pj-note code { font: 12px var(--mono); color: var(--muted); }
.pj-row { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 10px 10px 10px 16px;
  border-bottom: 1px solid var(--line); transition: background-color var(--ease); }
.pj-row:last-child { border-bottom: 0; }
.pj-row:hover { background: var(--surface2); }
.pj-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pj-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pj-name { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-row.off .pj-name { color: var(--muted); font-weight: 500; }
.pj-desc { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-desc.quiet, .pj-who.quiet { color: var(--faint); }
.pj-who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-who b { font-weight: 500; color: var(--faint); }
.pj-acts { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.pj-row:has(.confirm) { flex-wrap: wrap; row-gap: 8px; }
.pj-row > .confirm { flex: 1 1 100%; max-width: 100%; justify-content: flex-start; }
.pj-row > .confirm input { flex: 1 1 220px; min-width: 0; height: 26px; padding: 0 8px; font-size: 12px; }
.pj-tag { flex: none; padding: 0 6px; font-size: 11px; line-height: 18px; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pj-tag.off { color: var(--faint); border-style: dashed; }
.pj-add { flex-wrap: wrap; }
.pj-add #new-project { flex: 0 1 200px; }
.pj-add #new-project-desc { flex: 1 1 240px; }

/* shared by Home's panels */
.phead { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 46px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface2); font-size: 14px; font-weight: 650; color: var(--ink); }
.cell-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.state { display: inline-block; padding: 1px 7px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.state.open { color: var(--accent); border-color: rgba(218, 105, 71, .4); background: rgba(218, 105, 71, .1); }
.attach { display: flex; align-items: center; gap: 4px; }

/* inline confirm: the button gives way to the question and its answers */
.confirm { max-width: 560px; display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; white-space: normal;
  padding: 3px 4px 3px 9px; border: 1px solid rgba(213, 149, 135, .45); background: rgba(213, 149, 135, .07);
  font-size: 12px; font-weight: 400; color: var(--ink); text-align: left; }
.link { color: var(--accent); font-size: 12px; }
.link:hover { text-decoration: underline; }
.sentence { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.sentence select, .sentence input { height: 28px; padding: 0 8px; font-size: 12px; }
.sentence .hint { flex-basis: 100%; }

/* member: what I may use and the ask form, under the sessions behind "Ask for access" */
#my-access { flex: none; max-width: 720px; }
.mine-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; align-items: baseline; padding: 10px 14px; }
.mine-rows > span { font-size: 12px; color: var(--faint); }
.mine-rows .none { font-size: 12px; color: var(--faint); }
.mine-rows .cell-tags .tag[title] { cursor: help; }
.ask { border-top: 1px solid var(--line); border-bottom: 0; color: var(--ink); }
.ask b { font-weight: 600; color: var(--ink); margin-right: 4px; }
.ask #ask-target, .ask #ask-why { flex: 1 1 100%; min-width: 0; }
#ask-err { padding: 0 14px 10px; }

@media (max-width: 720px) {
  .btn.p-gl { max-width: 104px; }
  .p-line .p-main { min-width: 92px; }
  header { gap: 16px; padding: 0 16px; }
  .brand span { display: none; }
  /* Home: one column. The list first; a row opens its chat, Back returns */
  #home { display: flex; flex-direction: column; overflow: hidden; }  /* a sliding chat never widens the page */
  #home .side { flex: 1; border-right: 0; }
  #home.open .side, #home:not(.open) .chat { display: none; }
  #home .chat { flex: 1; }
  .back { display: inline-flex; }
  #home.open .chat.enter { animation: slide-in 180ms cubic-bezier(.2, .7, .3, 1); }
  #home.open .chat.leave { animation: slide-out 160ms ease-in forwards; }
  .chat-head { gap: 9px; padding: 0 12px; }
  #warns li { padding-left: 12px; padding-right: 12px; }
  #warns li > span { white-space: normal; }
  #log { padding: 6px 16px 14px; }
  .access-pane { padding: 12px 16px; }
  .compose { padding: 8px 12px 12px; gap: 6px; }
  .compose .btn.primary { padding: 0 12px; }
  .compose .btn.primary span { display: none; }
  .compose .btn[aria-busy="true"]::before { left: calc(50% - 6px); }
  .compose .file-chip { max-width: 40%; }
  .chat > .err { padding: 0 12px 8px; }
  /* Team: the column uses the phone's width; a waiting line puts its answers under the words */
  .team { padding: 18px 16px 32px; }
  .w-row { flex-wrap: wrap; row-gap: 8px; padding-left: 14px; }
  .w-text { flex-basis: 100%; flex-wrap: wrap; white-space: normal; }
  .w-why { flex-basis: 100%; margin-left: 0; white-space: nowrap; }
  .w-acts .btn { min-width: 64px; }
  .p-main { grid-template-columns: 8px minmax(0, max-content) minmax(0, 1fr) 13px; column-gap: 10px; padding-left: 14px; }
  .p-main.still { grid-template-columns: 8px minmax(0, max-content) minmax(0, 1fr); }
  .p-projects, .p-link { padding-left: 14px; }
  .p-line:has(.confirm) { flex-wrap: wrap; }
  .p-line:has(.confirm) .p-act { flex-basis: 100%; padding: 0 0 10px 14px; }
  .p-act .confirm { max-width: 100%; justify-content: flex-start; }
  .p-act { min-width: 0; }
  .add-link { flex-wrap: wrap; }
  .add-who { flex-basis: 100%; }
  .add-link input { flex-basis: 100%; height: 34px; }
  .add-form input { flex: 1 1 auto; }
  .pj-row { flex-wrap: wrap; row-gap: 8px; padding-left: 14px; }
  .pj-text { flex-basis: 100%; }
  .pj-desc, .pj-who { white-space: normal; }
  .pj-acts { flex-basis: 100%; justify-content: flex-start; }
  .pj-add #new-project, .pj-add #new-project-desc { flex: 1 1 100%; height: 34px; }
  .mine-rows { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .mine-rows > span:not(:first-child) { margin-top: 6px; }
  #lock .hint { margin-top: -8px; }
}
@keyframes slide-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide-out { to { transform: translateX(32px); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.btn[aria-busy="true"] { position: relative; }
.btn[aria-busy="true"] svg { visibility: hidden; }
.btn[aria-busy="true"]::before { content: ""; position: absolute; left: 16px; width: 12px; height: 12px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  /* no moving dots: the words say it */
  .working .dots, .tick .spin { display: none; }
  .working.busy .what::after { content: "\2026"; }
}

  });
  $("add-person-btn").addEventListener("click", function () { added = null; addBox(true); });
  $("add-person-cancel").addEventListener("click", function () { addBox(false); });
  $("add-box").addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); addBox(false); } });
  $("add-person").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("new-name").value.trim(), btn = $("add-person").querySelector("button[type=submit]");
    if (!name || btn.getAttribute("aria-busy") === "true") return;
    btn.setAttribute("aria-busy", "true");
    var gl = gitlabOn() ? $("new-gitlab").value.trim() : "";
    api("/api/people", gl ? { name: name, gitlab: gl } : { name: name })
      .then(function () { return api("/api/invites", { person: name }); })
      .then(function (r) { return r.json(); })
      .then(function (x) {
        invites = invites.concat([{ person: name, url: x.url, code: x.code }]);
        added = { name: name, url: x.url };
        showAdded();
      })
      .catch(function (x) { teamErr("add-err", x.message); })
      .then(function () { btn.removeAttribute("aria-busy"); });
  });
  $("add-project-btn").addEventListener("click", function () { projectBox(true); });
  $("add-project-cancel").addEventListener("click", function () { projectBox(false); });
  $("add-project-box").addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); projectBox(false); } });
  $("add-project").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("new-project").value.trim(), btn = $("add-project").querySelector("button[type=submit]");
    if (!name || btn.getAttribute("aria-busy") === "true") return;
    btn.setAttribute("aria-busy", "true");
    api("/api/projects", { name: name, description: $("new-project-desc").value.trim() })
      .then(function () { return get("/api/feed"); })
      .then(function (f) { feed = f; projectBox(false); flash("added:" + name); })
      .catch(function (x) { teamErr("add-project-err", x.message); })
      .then(function () { btn.removeAttribute("aria-busy"); });
  });
  $("ask-kind").addEventListener("change", askNames);
  $("ask-kind").addEventListener("change", function () {
    $("ask-target").placeholder = $("ask-kind").value === "machine" ? "Machine name" : "Project name";
  });
  $("ask-access").addEventListener("submit", function (e) {
    e.preventDefault();
    var target = $("ask-target").value.trim(), kind = $("ask-kind").value;
    if (!target) return;
    api("/api/requests", { kind: kind, target: target, why: $("ask-why").value.trim(),
                           role: kind === "project" ? $("ask-role").value : "read" })
      .then(function () { $("ask-err").hidden = true; $("ask-target").value = ""; $("ask-why").value = ""; loadAccess(); })
      .catch(function (x) { $("ask-err").hidden = false; $("ask-err").textContent = x.message; });
  });
  $("attach").addEventListener("click", function () { $("file-in").click(); });
  $("file-in").addEventListener("change", function () {
    var f = $("file-in").files[0];
    if (f) { attached = { file: f, id: null }; renderAttached(); sendErr(""); $("text").focus(); }
  });
  function boot() {
    get("/api/me").then(start).catch(function () {
      if ($("app").hidden) return;  /* locked: the token was refused */
      live(false); setTimeout(boot, 2000);
    });
  }
  function start(m) {
    me = m;
    seen = {}; feed = null; invites = []; myAccess = null; conv = "mgr"; phoneOpen = false; askOpen = false;
    readMap = store(function (s) { var r = JSON.parse(s.getItem("kaptyorka.read." + m.person) || "null"); return r && typeof r === "object" ? r : null; });
    fleet = { warnings: [] }; fleetAt = 0; proposals = []; proposalsAt = 0; openPerson = null; gitlab = null; gitlabAt = 0;
    $("viewer-name").textContent = m.person;
    $("viewer-name").title = "Signed in as " + m.person + (m.role === "admin" ? " (admin)" : "") + " on " + m.device;
    document.querySelectorAll(".admin-only").forEach(function (n) { n.hidden = m.role !== "admin"; });
    $("ask-link").hidden = m.role === "admin";
    $("side-foot").hidden = m.role === "admin";
    $("text").placeholder = "Message manager";
    show(view);
    poll();
  }
  if (token) { enter(); boot(); } else lockMode();
})();
</script>
</body>
</html>
