# The wall canaries with fixed names (secure design v2, 4.6), in folders only root can write: the
# box must never see them. The canaries in /tmp and /dev/shm get fresh names from enter.
f /.kaptyorka-wall-canary 0644 root root - KAPTYORKA-WALL-CANARY
f /home/.kaptyorka-wall-canary 0644 root root - KAPTYORKA-WALL-CANARY
d /run/kaptyorka 0755 root root -
f /run/kaptyorka/wall-canary 0644 root root - KAPTYORKA-WALL-CANARY
