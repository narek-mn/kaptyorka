[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaptyorka"
version = "0.1.3"
description = "A team hub for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narek-mn"}]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/narek-mn/kaptyorka"
Repository = "https://github.com/narek-mn/kaptyorka"
Issues = "https://github.com/narek-mn/kaptyorka/issues"

[project.scripts]
kaptyorka = "kaptyorka.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaptyorka = ["web/*.html"]

[tool.pytest.ini_options]
markers = ["slow: tests that call real agent tools"]
addopts = "-m 'not slow'"
