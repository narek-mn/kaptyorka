[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kubrik"
version = "0.1.0"
description = "A team hub for coding agents"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narek-mn"}]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/narek-mn/kubrik"
Repository = "https://github.com/narek-mn/kubrik"
Issues = "https://github.com/narek-mn/kubrik/issues"

[project.scripts]
kubrik = "kubrik.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubrik = ["web/*.html"]

[tool.pytest.ini_options]
markers = ["slow: tests that call real agent tools"]
addopts = "-m 'not slow'"
